baseURL = "https://newthink.ai/"
languageCode = "en-US"
title = "New Think"
theme = "hugo-theme-stack"

[markup.goldmark.renderer]
  unsafe = true

[params]
  mainSections = ["posts"]
  description = "NewThink.ai — Louisville-area applied AI firm. We help organizations move from AI awareness to deployed, working systems."
  scheduleUrl = "https://timetuna.com/new-think"

  [params.sidebar]
    subtitle = "Applied AI for Louisville-area business."
    compact = false

  [params.article]
    readingTime = true
    math = false
    toc = false

  [params.comments]
    enabled = false

  [params.defaultImage.opengraph]
    enabled = false

  [params.hero]
    subheadline = "NewThink.ai helps Louisville-area organizations move from AI awareness to deployed, working systems — built inside your operation, around your actual workflows."

[[params.heroLines]]
  text = "Every business has access to AI."

[[params.heroLines]]
  text = "Not every business knows how to use it."

[[params.heroLines]]
  text = "Be one that does."

  [params.what]
    body = '''
Most organizations have lots of casual exposure to AI — played with some tools, seen some demos. They have seen results and know AI matters. What they're missing is the path from 'this is interesting' to 'this could work on our problem' to 'this is working and we're getting results.'

NewThink.ai is a Louisville-area applied AI firm.

- We'll sit with your stakeholders, your teams, or just selected individuals, and work through your workflows to map out what makes sense to automate. **(Audit)**
- We'll then dive into the data and the systems to hammer out the details of a working prototype — passing live data through curated setups. **(Evaluation)**
- After review, we'll deploy and monitor the custom solution. **(Deploy)**

A standardized working implementation — not a report, demo, or recommendation.

**Your organization is no longer on the AI sidelines — you're in the game.**
'''

  [params.schedule]
    headline = "Ready to move past the demo?"
    subheadline = "Tell us what you're trying to accomplish. A 30-minute conversation is usually enough to figure out the right first step — and whether we're the right fit."
    buttonText = "Schedule a Free Call"

[[params.usecases]]
  icon = "🚀"
  title = "Getting Started"
  description = "From ground zero to a working AI prototype. We audit your operation, find the highest-value first use case, and build something real."

[[params.usecases]]
  icon = "⚙️"
  title = "Custom AI Workflows"
  description = "AI-augmented work systems built around how your team actually operates — connecting Claude, your data, and your existing tools."

[[params.usecases]]
  icon = "💼"
  title = "Claude for Small Business"
  description = "Your team running with Anthropic's Claude for Business — configured, trained, and genuinely adopted, not just licensed."

[[params.usecases]]
  icon = "🤖"
  title = "NanoClaw for Business"
  description = "A dedicated AI agent deployed into your operation for a specific, high-volume workflow. Built and operated by NewThink.ai."

